<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voicebot</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      color: oklch(0.985 0 0); user-select: none; -webkit-user-select: none;
      display: flex; align-items: center; justify-content: center;
    }
    .orbbox { position: relative; width: 200px; height: 200px; }
    .orbbox canvas { position: absolute; inset: 0; width: 200px; height: 200px; }
    #orb2d, #orb3d { display: none; pointer-events: none; }
    #orb { cursor: pointer; transition: transform .45s ease; }
    body.asleep #orb { transform: scale(.5); }
    body.nomic #orb { animation: nomic-pulse 1.4s ease-in-out infinite; }
    @keyframes nomic-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="orbbox">
    <canvas id="orb2d" width="400" height="400"></canvas>
    <canvas id="orb3d" width="400" height="400"></canvas>
    <canvas id="orb" title="Drag to move. Click to mute or unmute. Double-click for a new conversation. Right-click for the Debug window." aria-label="Voicebot orb"></canvas>
  </div>

  <script src="vendor/livekit-client.umd.min.js"></script>
  <script src="vendor/aura.js"></script>
  <script src="voicebot-orb-state.js"></script>
  <script type="module" src="orb-designs.js"></script>
  <script>
    // Voicebot orb: waits for Zana's supervisor, joins a fresh LiveKit room as the
    // user's mic and speaker, and answers the agent's RPCs (zana.paste, zana.screen).
    const LK = window.LivekitClient;
    const Orb = window.VoicebotOrb;
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    let room = null;
    let connecting = false;
    let reconnectAfterConnecting = false;
    let agentParticipant = null;
    let agentState = 'starting';
    let agentOrbState = null;
    let muted = false;
    let dictating = false;
    let leaving = false;
    let asleep = false;
    let voicePrint = null; // { seconds, needed } while voice print mode records
    let preview = null;    // a state shown for a few seconds by zana.preview_state (tests)
    let previewTimer = null;
    const ASLEEP_COLOR = '#636366';
    let wakeWord = '';
    let agentTimer = null;

    // No text under the orb: the state shows on hover (and every step is in the Debug window).
    const HELP = 'Drag to move. Click to mute or unmute. Double-click for a new conversation. Right-click for the Debug window.';
    function setStatus(text, detail = '') {
      const line = detail ? `${text}: ${detail}` : text;
      orb.title = `${line}\n${HELP}`;
      orb.setAttribute('aria-label', `Voicebot: ${line}`);
    }

    async function waitUntilReady() {
      for (;;) {
        const s = await invoke('voicebot_status');
        if (s.stage === 'ready') return;
        setStatus({ installing: 'Installing', starting: 'Starting', loading: 'Loading', error: 'Error', off: 'Off' }[s.stage] || s.stage, s.detail);
        await new Promise((r) => setTimeout(r, s.stage === 'error' ? 5000 : 1000));
      }
    }

    function resetAgent() {
      agentParticipant = null;
      agentOrbState = null;
      agentState = 'offline';
      asleep = false;
      voicePrint = null;
      clearTimeout(previewTimer);
      previewTimer = null;
      preview = null;
      clearTimeout(agentTimer);
      agentTimer = null;
    }

    // Wire contract: the agent participant retains `zana.orb.state` as one of
    // idle/listening/thinking/talking/working. `lk.agent.state` is the fallback
    // for older agents; snapshots and updates both come from that participant.
    function syncAgent(participant, changed = {}) {
      if (!room || !participant || room.remoteParticipants.get(participant.identity) !== participant) return;
      const attrs = participant.attributes || {};
      const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
      if (agentParticipant && agentParticipant !== participant) return;
      // Arrival and readiness are separate: the agent may join before its
      // state attributes exist. LiveKit's isAgent covers kind and permissions.
      if (!agentParticipant && !participant.isAgent) return;
      const first = !agentParticipant;
      agentParticipant = participant;
      clearTimeout(agentTimer);
      agentTimer = null;
      if (has(changed, 'lk.agent.state')) agentState = changed['lk.agent.state'] || 'connecting';
      else if (first && has(attrs, 'lk.agent.state')) agentState = attrs['lk.agent.state'];
      if (has(changed, 'zana.orb.state')) agentOrbState = changed['zana.orb.state'] || null;
      else if (first && has(attrs, 'zana.orb.state')) agentOrbState = attrs['zana.orb.state'];
      showState();
    }

    function waitForAgent(activeRoom) {
      clearTimeout(agentTimer);
      agentTimer = setTimeout(() => {
        if (room === activeRoom && !agentParticipant) newConversation();
      }, 15000);
    }

    async function connect() {
      if (connecting || room) return;
      connecting = true;
      let activeRoom = null;
      try {
        await waitUntilReady();
        setStatus('Joining');
        const { url, token } = await invoke('voicebot_join');
        agentState = 'connecting';
        agentOrbState = null;
        agentParticipant = null;
        activeRoom = new LK.Room({ adaptiveStream: true, dynacast: true });
        room = activeRoom;
        activeRoom.on(LK.RoomEvent.TrackSubscribed, (track) => {
          if (room === activeRoom && track.kind === 'audio') document.body.appendChild(track.attach());
        });
        activeRoom.on(LK.RoomEvent.ParticipantAttributesChanged, (changed, participant) => {
          if (room === activeRoom) syncAgent(participant, changed);
        });
        activeRoom.on(LK.RoomEvent.ParticipantConnected, (participant) => {
          if (room === activeRoom) syncAgent(participant, participant.attributes || {});
        });
        activeRoom.on(LK.RoomEvent.ParticipantDisconnected, (participant) => {
          if (room !== activeRoom || participant !== agentParticipant) return;
          resetAgent();
          showState();
          waitForAgent(activeRoom);
        });
        activeRoom.on(LK.RoomEvent.ActiveSpeakersChanged, () => {
          if (room === activeRoom) showState();
        });
        activeRoom.on(LK.RoomEvent.DataReceived, (payload, _p, _k, topic) => {
          if (room !== activeRoom || topic !== 'events') return;
          try {
            const ev = JSON.parse(new TextDecoder().decode(payload));
            if (ev.kind === 'sleep') { asleep = ev.asleep; wakeWord = ev.wake_word || ''; showState(); return; }
            if (ev.kind === 'voiceprint') {
              voicePrint = ev.action === 'enrolled' ? null : { seconds: ev.seconds || 0, needed: ev.needed || 8 };
              showState();
            }
          } catch (_) { /* not an event */ }
        });
        activeRoom.on(LK.RoomEvent.Disconnected, () => {
          if (room !== activeRoom) return;
          room = null;
          resetAgent();
          showState();
          if (!leaving) setTimeout(() => connect().catch(fail), 2000);
        });
        activeRoom.registerRpcMethod('zana.paste', async ({ payload }) => {
          await invoke('voicebot_paste', { text: payload });
          return 'pasted at the cursor';
        });
        activeRoom.registerRpcMethod('zana.screen', async () => invoke('voicebot_screen_context'));
        activeRoom.registerRpcMethod('zana.screenshot', async ({ payload }) => invoke('voicebot_screenshot', { conversationId: payload }));
        activeRoom.registerRpcMethod('zana.mute', async () => { muted = true; await applyMic(); return 'microphone off'; });
        // Test hook: accepts the five wire states and the legacy "speaking" alias.
        activeRoom.registerRpcMethod('zana.preview_state', async ({ payload }) => {
          clearTimeout(previewTimer);
          preview = payload || null;
          showState();
          previewTimer = setTimeout(() => { preview = null; showState(); }, 5000);
          return `previewing ${payload}`;
        });
        // Voicebot reading and changing its own settings (the same rules as Preferences).
        activeRoom.registerRpcMethod('zana.settings', async () => JSON.stringify(await invoke('voicebot_self_settings')));
        activeRoom.registerRpcMethod('zana.set_setting', async ({ payload }) => {
          const { name, value } = JSON.parse(payload);
          try {
            const change = await invoke('set_voicebot_setting', { name, value: String(value) });
            if (name === 'mic_check_minutes') micCheckMinutes = Number(value) || micCheckMinutes;
            if (name === 'orb_design') orbDesign = String(change.message.match(/set to (\w+)/)?.[1] || orbDesign).toLowerCase();
            if (change.restart) pendingRestart = true; // after this reply, so the confirmation is heard
            return change.message;
          } catch (e) {
            return `Not changed: ${e}`;
          }
        });
        activeRoom.registerRpcMethod('zana.set_wake_word', async ({ payload }) => {
          await invoke('set_voicebot_wake_word', { wakeWord: payload });
          return payload ? `wake word set to ${payload}` : 'wake word removed';
        });
        await activeRoom.connect(url, token);
        if (room !== activeRoom) return;
        await applyMic();
        if (room !== activeRoom) return;
        // Attribute updates can precede join completion, so also read snapshots.
        activeRoom.remoteParticipants.forEach((participant) => syncAgent(participant, participant.attributes || {}));
        if (!agentParticipant) waitForAgent(activeRoom);
        showState();
      } catch (error) {
        if (activeRoom && room === activeRoom) {
          room = null;
          resetAgent();
          try { await activeRoom.disconnect(); } catch (_) { /* already disconnected */ }
        }
        throw error;
      } finally {
        connecting = false;
        if (reconnectAfterConnecting) {
          reconnectAfterConnecting = false;
          if (!room) connect().catch(fail);
        }
      }
    }

    function fail(e) {
      setStatus('Error', String(e && e.message || e).slice(0, 120));
      setTimeout(() => connect().catch(fail), 5000);
    }

    async function applyMic() {
      if (room) await room.localParticipant.setMicrophoneEnabled(!muted && !dictating);
      showState();
    }

    // Mic check: no working microphone track (none published, ended, or muted by the system, as when
    // permission is missing) for micCheckMinutes turns the orb into a pulsing red "No Microphone".
    // Silence never counts: noise-gated microphones (Voice Isolation) send exact zeros when quiet.
    let micCheckMinutes = 2;
    // The orb's look: the original Aura, or a design from orb-designs.js drawn behind this canvas
    // (which stays on top for clicks, drags and the tooltip).
    let orbDesign = 'original';
    let designs = null;
    let lastMicSignal = Date.now();
    let micSilent = false;
    let micMeter = null;
    function liveMicTrack() {
      const pub = room && room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
      const track = pub && pub.track && pub.track.mediaStreamTrack;
      return track && track.readyState === 'live' && !track.muted ? track : null;
    }
    // A level meter on the live track, for showing your voice.
    function meterFor(track) {
      if (micMeter && micMeter.track === track) return;
      try { micMeter && micMeter.ctx.close(); } catch (_) { /* already closed */ }
      const ctx = new AudioContext();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      ctx.createMediaStreamSource(new MediaStream([track])).connect(analyser);
      micMeter = { ctx, analyser, track, buf: new Float32Array(analyser.fftSize) };
    }
    setInterval(() => {
      const track = liveMicTrack();
      if (track) meterFor(track);
      if (!room || muted || dictating || track) lastMicSignal = Date.now();
      const silent = Date.now() - lastMicSignal > micCheckMinutes * 60000;
      if (silent !== micSilent) { micSilent = silent; showState(); }
    }, 1000);
    // Settings changed elsewhere (Preferences, or Voicebot itself) reach the orb within seconds.
    function syncSettings() {
      invoke('voicebot_self_settings').then((cfg) => {
        micCheckMinutes = cfg.mic_check_minutes || micCheckMinutes;
        orbDesign = cfg.orb_design || orbDesign;
      }).catch(() => {});
    }
    syncSettings();
    setInterval(syncSettings, 3000);
    // Your voice level while you talk (the designs move with it); 0 when it can't be measured.
    function micVisual() {
      if (!micMeter || micMeter.ctx.state !== 'running') return 0;
      micMeter.analyser.getFloatTimeDomainData(micMeter.buf);
      let s = 0;
      for (const v of micMeter.buf) s += v * v;
      return Math.min(1, Math.sqrt(s / micMeter.buf.length) * 7);
    }

    // Zana calls this while its own dictation records, so the agent ignores it.
    window.zanaDictation = (active) => { dictating = active; applyMic(); };

    function visualState() {
      return Orb.resolveState({
        connected: !!room, muted, dictating, asleep, voicePrint, preview, agentOrbState, agentState,
        userSpeaking: !!(room && room.localParticipant && room.localParticipant.isSpeaking), micSilent,
      });
    }

    function showState() {
      if (preview) return setStatus(Orb.styleForState(visualState()).label);
      if (dictating) return setStatus('Paused', 'Zana is dictating');
      if (visualState() === 'nomic') return setStatus('No Microphone', `No working microphone for ${micCheckMinutes} minutes: check System Settings, Privacy and Security, Microphone, for Zana`);
      if (pendingRestart && agentState === 'listening') { pendingRestart = false; setTimeout(newConversation, 800); }
      if (muted) return setStatus('Muted', 'Click the orb to unmute');
      if (asleep) return setStatus('Sleeping', wakeWord ? `Say "${wakeWord}" to wake it` : '');
      if (voicePrint) return setStatus('Voice Print', `Keep talking: ${Math.min(voicePrint.seconds, voicePrint.needed).toFixed(0)} of ${voicePrint.needed} seconds`);
      if (!agentOrbState && agentState === 'connecting') return setStatus('Joining');
      if (!agentOrbState && agentState === 'initializing') return setStatus('Waking Up');
      if (!agentOrbState && agentState === 'offline') return setStatus('Reconnecting');
      setStatus(Orb.styleForState(visualState()).label);
    }

    let pendingRestart = false; // Voicebot changed a setting that applies in a fresh conversation
    let restarting = false; // a model and a voice change can both ask for a new conversation at once
    async function newConversation() {
      if (restarting) return;
      restarting = true;
      setTimeout(() => { restarting = false; }, 3000);
      leaving = true;
      const oldRoom = room;
      try {
        if (oldRoom) await oldRoom.disconnect();
      } catch (error) {
        setStatus('Error', `Could not start a new conversation: ${(error && error.message) || String(error)}`);
        return;
      } finally {
        leaving = false;
      }
      // Be safe even if a disconnected event is delayed or not delivered.
      if (oldRoom && room === oldRoom) {
        room = null;
        resetAgent();
      }
      if (connecting) reconnectAfterConnecting = true;
      else connect().catch(fail);
    }

    // Drag anywhere to move the orb (after 4 px, so clicks still work).
    let downAt = null;
    let dragged = false;
    document.addEventListener('pointerdown', (event) => {
      if (event.button === 0) { downAt = [event.screenX, event.screenY]; dragged = false; }
    });
    document.addEventListener('pointermove', (event) => {
      if (!downAt || Math.hypot(event.screenX - downAt[0], event.screenY - downAt[1]) < 4) return;
      downAt = null;
      dragged = true;
      window.__TAURI__.window.getCurrentWindow().startDragging().catch(() => {});
    });
    document.addEventListener('pointerup', () => { downAt = null; });

    // Single click mutes; a double-click starts a new conversation instead.
    let clickTimer = null;
    const orb = document.getElementById('orb');
    orb.addEventListener('click', () => {
      if (dragged) { dragged = false; return; }
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { muted = !muted; applyMic(); }, 250);
    });
    orb.addEventListener('dblclick', () => { clearTimeout(clickTimer); newConversation(); });
    // Right-click opens the Debug window: what Voicebot hears, says and runs.
    orb.addEventListener('contextmenu', (event) => { event.preventDefault(); invoke('open_voicebot_debug'); });

    // The orb: LiveKit's Aura visualizer, driven by the resolved state and
    // the agent's voice level. Muted, paused, and sleeping use a dim idle look.
    let aura = null;
    try {
      aura = window.createAura(orb, { color: Orb.styleForState('idle').color, colorShift: 0.05, themeMode: 'dark' });
    } catch (e) {
      setStatus('Error', `The orb needs WebGL: ${e.message}`);
    }
    let lastTick = 0;
    function auraTick(now = 0) {
      const dt = Math.min(0.05, Math.max(0, (now - lastTick) / 1000));
      lastTick = now;
      if (!designs && window.ZanaOrbDesigns) {
        designs = window.ZanaOrbDesigns.create({ canvas2d: document.getElementById('orb2d'), canvas3d: document.getElementById('orb3d') });
      }
      const useDesign = orbDesign !== 'original' && designs;
      if (orb.style) orb.style.opacity = useDesign ? '0' : '';
      if (useDesign) {
        const state = visualState();
        const sleeping = asleep && !preview && state !== 'nomic';
        document.body.classList.toggle('asleep', false);
        document.body.classList.toggle('nomic', false);
        let agentVoice = 0;
        if (room) room.remoteParticipants.forEach((p) => { agentVoice = Math.max(agentVoice, p.audioLevel || 0); });
        const level = state === 'talking' ? agentVoice : (state === 'listening' || state === 'voiceprint') ? micVisual() : 0;
        designs.draw(orbDesign, dt, now / 1000, sleeping ? 'asleep' : state, level);
      } else if (designs) {
        designs.hide();
      }
      if (aura && !useDesign) {
        const state = visualState();
        const sleeping = asleep && !preview && state !== 'nomic';
        document.body.classList.toggle('asleep', sleeping);
        document.body.classList.toggle('nomic', state === 'nomic');
        const style = Orb.styleForState(state);
        aura.setState(style.auraState);
        aura.setColor(sleeping ? ASLEEP_COLOR : style.color);
        let voice = 0;
        if (room) room.remoteParticipants.forEach((p) => { voice = Math.max(voice, p.audioLevel || 0); });
        aura.setVolume(voice);
      }
      requestAnimationFrame(auraTick);
    }
    requestAnimationFrame(auraTick);
    connect().catch(fail);
  </script>
</body>
</html>
