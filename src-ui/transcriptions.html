<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zana Transcriptions</title>
  <style>
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.185 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.62 0 0);
      --accent: oklch(0.269 0 0);
      --primary: oklch(0.985 0 0);
      --primary-foreground: oklch(0.145 0 0);
      --border: transparent;
      --destructive: #f87171;
      --speech: #5b9ef5;
      --radius: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: var(--background);
      color: var(--foreground);
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .titlebar {
      height: 44px;
      flex: 0 0 auto;
      background: var(--background);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: none;
      flex: 0 0 auto;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: var(--foreground);
    }
    .title-meta {
      font-size: 11px;
      color: var(--muted-foreground);
    }
    .titlebar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    button {
      padding: 7px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 0;
      transition: background 0.2s, transform 0.2s;
    }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .btn-secondary {
      background: var(--muted);
      color: var(--foreground);
    }
    .btn-secondary:hover { background: var(--accent); }
    .content {
      flex: 1 1 auto;
      padding: 14px;
      overflow: auto;
      -webkit-app-region: no-drag;
    }
    .history-list {
      display: grid;
      gap: 8px;
    }
    .history-item {
      display: grid;
      gap: 8px;
      padding: 10px;
      background: var(--muted);
      border-radius: var(--radius);
    }
    .history-item-head,
    .history-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .history-time {
      color: var(--muted-foreground);
      font-size: 11px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }
    .history-badge {
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(91, 158, 245, 0.16);
      color: var(--foreground);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .history-block {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .history-label {
      color: var(--muted-foreground);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .history-text {
      color: var(--foreground);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .history-empty,
    .history-error {
      color: var(--muted-foreground);
      font-size: 12px;
      padding: 4px 0;
    }
    .history-error { color: var(--destructive); }
      .brand-mark { display: grid; place-items: center; }
    .brand-mark svg { width: 20px; height: 20px; display: block; }
  </style>
  <link rel="stylesheet" href="window-chrome.css">
  <script src="window-controls.js"></script>
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="-0.5 -1.5 24 24"><defs><linearGradient id="tb-mark" x1="18%" y1="10%" x2="88%" y2="92%">
              <stop offset="0%" stop-color="#f5f5f5"/>
              <stop offset="46%" stop-color="#b8b8b8"/>
              <stop offset="100%" stop-color="#7a7a7a"/>
            </linearGradient></defs><path fill="url(#tb-mark)" d="M8.9 7h5.2l-2.6 4.4L8.9 7Zm13.5-4.9C21.7.9 20.4.1 18.9.1L9.4 0C7.9 0 6.5.8 5.8 2.1c-.8 1.3-.8 2.8 0 4.1l4.3 7.5c-.3.3-.8.5-1.3.5-.7 0-1.2-.3-1.6-.9L2.6 5.1c-.2-.3-.4-.6-.5-1.1-.1-.7.1-1.3.5-2 .4-.6 1-1.1 1.7-1.4L6.1.1 4.1.1C2.6.1 1.3.9.6 2.1c-.8 1.3-.8 2.8 0 4.1l4.7 8.2c.7 1.3 2.1 2.1 3.6 2.1s2.9-.8 3.6-2.1L16.8 7c.5.1.9.4 1.1.9.3.6.3 1.2 0 1.8L13 17.8c-.2.3-.4.6-.7.9-.5.4-1.2.5-2 .5-.7 0-1.5-.3-2.1-.8l-1.3-1.1 1 1.7c.7 1.2 2.1 2 3.6 2s2.8-.8 3.6-2l4.8-8.1c.8-1.3.8-2.9 0-4.2s-2.1-2.1-3.6-2.1H7.6c-.1-.5-.1-1 .2-1.4.3-.6.9-.9 1.6-.9h.1l9.4.1c.4 0 .7 0 1.1.2.7.2 1.1.7 1.5 1.4.4.6.5 1.4.4 2.2l-.3 1.7 1-1.7c.6-1.3.6-2.8-.2-4.1Z"/></svg>
    </div>
    <div class="title" data-tauri-drag-region>Transcriptions</div>
    <div class="title-meta" id="transcript-history-count" data-tauri-drag-region>loading...</div>
    <div class="titlebar-actions">
      <button class="btn-secondary" type="button" onclick="loadTranscriptHistory()">Refresh</button>
    </div>
    <div class="window-controls">
      <button type="button" data-window="minimize" aria-label="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6"/></svg></button>
      <button type="button" data-window="close" aria-label="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg></button>
    </div>
  </div>

  <div class="content">
    <div class="history-list" id="transcript-history-list"></div>
  </div>

  <script>
    let transcriptHistoryEntries = [];

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatTranscriptTime(timestamp) {
      if (!timestamp) return 'unknown time';
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return timestamp;
      return date.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    async function loadTranscriptHistory() {
      const count = document.getElementById('transcript-history-count');
      const list = document.getElementById('transcript-history-list');
      count.textContent = 'loading...';
      list.innerHTML = '';

      if (!window.__TAURI__) {
        count.textContent = 'not running in app';
        list.innerHTML = '<div class="history-empty">transcriptions are stored locally in the app</div>';
        return;
      }

      try {
        const { invoke } = window.__TAURI__.core;
        transcriptHistoryEntries = await invoke('get_transcript_history');
        count.textContent = `${transcriptHistoryEntries.length} saved`;

        if (!transcriptHistoryEntries.length) {
          list.innerHTML = '<div class="history-empty">no saved transcriptions yet</div>';
          return;
        }

        list.innerHTML = transcriptHistoryEntries.map((entry, index) => {
          const finalText = entry.finalText || '';
          const rawText = entry.rawText || '';
          const showFinal = entry.usedRewrite || finalText !== rawText;

          return `<div class="history-item">
            <div class="history-item-head">
              <div class="history-time">${escapeHtml(formatTranscriptTime(entry.timestamp))}</div>
              <div class="history-badge">${entry.usedRewrite ? 'polished' : 'raw'}</div>
            </div>
            <div class="history-block">
              <div class="history-label">raw whisper</div>
              <div class="history-text">${escapeHtml(rawText)}</div>
            </div>
            ${showFinal ? `<div class="history-block">
              <div class="history-label">final pasted</div>
              <div class="history-text">${escapeHtml(finalText)}</div>
            </div>` : ''}
            <div class="history-actions">
              <button class="btn-secondary" type="button" onclick="copyTranscriptText(${index}, 'raw')">
                Copy Raw
              </button>
              <button class="btn-secondary" type="button" onclick="copyTranscriptText(${index}, 'final')">
                Copy Final
              </button>
            </div>
          </div>`;
        }).join('');
      } catch (e) {
        count.textContent = 'failed';
        list.innerHTML = `<div class="history-error">${escapeHtml(String(e))}</div>`;
      }
    }

    async function copyTranscriptText(index, kind) {
      const entry = transcriptHistoryEntries[index];
      if (!entry) return;
      const text = kind === 'raw' ? entry.rawText : entry.finalText;
      await navigator.clipboard.writeText(text || '');
    }

    // window.close() is a no-op for Tauri v2 secondary windows. Use the Tauri
    // window API; fall back to window.close() when running outside Tauri.
    async function closeWindow() {
      try {
        if (window.__TAURI__ && window.__TAURI__.window
            && typeof window.__TAURI__.window.getCurrentWindow === 'function') {
          await window.__TAURI__.window.getCurrentWindow().close();
          return;
        }
        if (window.__TAURI__ && window.__TAURI__.webviewWindow
            && typeof window.__TAURI__.webviewWindow.getCurrent === 'function') {
          await window.__TAURI__.webviewWindow.getCurrent().close();
          return;
        }
      } catch (e) {
        console.error('Failed to close via Tauri window API:', e);
      }
      window.close();
    }

    window.addEventListener('DOMContentLoaded', loadTranscriptHistory);
  </script>
</body>
</html>
