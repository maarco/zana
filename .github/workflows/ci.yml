name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: macos-latest
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
      CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/scripts/whisper-portable.cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Configure macOS SDK for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --sdk macosx --show-sdk-path) -Wno-everything" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: whisper-portable-v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check -p Zana-app --locked

      - name: Run tests
        run: cargo test -p Zana-app --locked

      - name: Run clippy
        run: cargo clippy -p Zana-app --all-targets --all-features --locked -- -D warnings

  windows-check:
    name: Windows compile check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Windows build
        run: cargo check -p Zana-app --locked

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # The repo config supplies allowlists only; explicitly load the default rules.
          config="$RUNNER_TEMP/zana-gitleaks.toml"
          printf '[extend]\nuseDefault = true\n\n' > "$config"
          cat .gitleaks.toml >> "$config"
          # The initial commit's deleted issue.txt contains the same macOS
          # crash-reporter identifier twice, not an API key. Ignore only these
          # immutable historical findings; all new findings still fail CI.
          ignore="$RUNNER_TEMP/.gitleaksignore"
          printf '%s\n' \
            '74de91144a2ac5b0eed3d2eb92d5f1763f00bc24:issue.txt:generic-api-key:21' \
            '74de91144a2ac5b0eed3d2eb92d5f1763f00bc24:issue.txt:generic-api-key:1018' > "$ignore"
          "$RUNNER_TEMP/gitleaks" detect --source . --config "$config" --gitleaks-ignore-path "$ignore" --redact --no-banner --exit-code 1

  release-pipeline-check:
    name: Release pipeline lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Catches release.yml and signing-script breakage on the PR, without
      # Apple credentials, instead of 40 minutes into a release run.
      - name: Lint workflows (actionlint runs shellcheck on run blocks)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Syntax-check inline scripts in src-ui pages
        run: python3 scripts/check_inline_js.py

      - name: Check release scripts and Tauri config
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=error scripts/*.sh
          jq empty src-tauri/tauri.conf.json

  voicebot-tests:
    name: Voicebot unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Voicebot unit-test dependencies
        run: |
          python -m pip install numpy==2.4.6 scipy==1.18.1 python-dotenv==1.2.4 \
            'livekit-agents[mcp]==1.8.8' livekit-plugins-openai==1.8.8 livekit-plugins-silero==1.8.8

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Lint Voicebot Python
        run: ruff check --select E4,E7,E9,F voicebot

      - name: Smoke-test Voicebot tool imports
        run: python voicebot/tests/agent_smoke.py

      - name: Run Voicebot unit tests
        run: python -m unittest discover -s voicebot/tests -p "test_*.py" -v

      - name: Load the Voicebot orb headlessly
        run: node --test src-tauri/tests/voicebot_orb.test.cjs

  voicebot-loopback-e2e:
    name: Voicebot loopback end-to-end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Voicebot e2e dependencies
        run: |
          python -m pip install numpy==2.4.6 scipy==1.18.1 python-dotenv==1.2.4 \
            'livekit-agents[mcp]==1.8.8' livekit-plugins-openai==1.8.8 livekit-plugins-silero==1.8.8

      - name: Install pinned LiveKit server
        env:
          LIVEKIT_VERSION: 1.13.10
          LIVEKIT_SHA256: c25a3e45fb922e9a93c6443d10c0ed041ba64342097e38632331736630283165
        run: |
          archive="$RUNNER_TEMP/livekit-server.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$LIVEKIT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" livekit-server
          chmod +x "$RUNNER_TEMP/livekit-server"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run the loopback Voicebot conversation
        run: python voicebot/tests/ci_e2e.py
