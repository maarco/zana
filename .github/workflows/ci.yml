name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check -p Zana-app --locked

      - name: Run tests
        run: cargo test -p Zana-app --locked

      - name: Run clippy
        run: cargo clippy -p Zana-app --all-targets --all-features --locked -- -D warnings

  windows-check:
    name: Windows compile check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Windows build
        run: cargo check -p Zana-app --locked

  release-pipeline-check:
    name: Release pipeline lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Catches release.yml and signing-script breakage on the PR, without
      # Apple credentials, instead of 40 minutes into a release run.
      - name: Lint workflows (actionlint runs shellcheck on run blocks)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Syntax-check inline scripts in src-ui pages
        run: python3 scripts/check_inline_js.py

      - name: Check release scripts and Tauri config
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=error scripts/*.sh
          jq empty src-tauri/tauri.conf.json

  voicebot-tests:
    name: Voicebot unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The speech filter, wake word, transcript, scrubber and voice-print audio plumbing.
      # The live e2e check (voicebot/tests/e2e_probe.py) needs a running Voicebot and stays manual.
      - name: Install numpy and scipy for the voice-print tests
        run: python -m pip install numpy==2.4.6 scipy==1.18.1

      - name: Run Voicebot unit tests
        run: python -m unittest discover -s voicebot/tests -p "test_*.py" -v
