name: Release

# A new version on main ships after CI passes. Existing annotated tags can
# still be pushed or dispatched for recovery.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (required unless preview is selected)
        required: false
        type: string
      preview:
        description: Build an ad-hoc sealed DMG from main without tagging or publishing
        type: boolean
        default: false
      signing:
        description: developer-id signs and notarizes (fails if a secret is missing); unsigned ad-hoc seals only
        type: choice
        options: [developer-id, unsigned]
        default: developer-id

concurrency:
  group: ${{ inputs.preview && 'release-preview' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  validate:
    name: Validate release source and versions
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      tag: ${{ steps.source.outputs.tag }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      sha: ${{ steps.source.outputs.sha }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag and check version parity
        id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PREVIEW: ${{ inputs.preview || false }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            sha="$CI_SHA"
            if [ "$sha" != "$(git rev-parse refs/remotes/origin/main)" ]; then
              echo "Skipping stale main CI run: $sha"
              exit 0
            fi
            version="$(git show "$sha:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
            TAG="v$version"
            tag_object=""
          elif [ "$PREVIEW" = true ]; then
            sha="$GITHUB_SHA"
            version="$(git show "$sha:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
            TAG="v$version"
            tag_object=""
          else
            sha="$(git rev-parse "refs/tags/$TAG^{commit}")" || { echo "::error::$TAG does not resolve to a commit"; exit 1; }
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::Unexpected ref $GITHUB_REF for tag $TAG"; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run this workflow from main (got $GITHUB_REF)"; exit 1; }
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag must look like v1.2.3: $TAG"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_run ] && [ "$PREVIEW" != true ]; then
            [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ] || { echo "::error::$TAG is not an existing annotated tag"; exit 1; }
            tag_object="$(git rev-parse "refs/tags/$TAG")"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "::error::Commit $GITHUB_SHA is not on origin/main"; exit 1; }
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo "::error::$TAG is not an ancestor of $GITHUB_SHA"; exit 1; }
            remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')" || { echo "::error::Could not read the remote tag $TAG"; exit 1; }
            [ "$remote_tag_object" = "$tag_object" ] || { echo "::error::Remote tag $TAG changed since checkout"; exit 1; }
          fi
          want="${TAG#v}"
          cargo_version="$(git show "$sha:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          tauri_version="$(git show "$sha:src-tauri/tauri.conf.json" | jq -r .version)"
          [ "$cargo_version" = "$want" ] || { echo "::error::Cargo.toml version $cargo_version != $want"; exit 1; }
          [ "$tauri_version" = "$want" ] || { echo "::error::tauri.conf.json version $tauri_version != $want"; exit 1; }
          if [ "$PREVIEW" = true ]; then
            { echo "ready=true"; echo "tag=$TAG"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "Skipping already published version $TAG"
              exit 0
            fi
            echo "::error::A GitHub release for $TAG already exists"; exit 1
          elif [[ ! "$response" =~ ^HTTP/[^[:space:]]+[[:space:]]+404([[:space:]]|$) ]]; then
            echo "::error::Could not check for an existing release: ${response%%$'\n'*}"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::$TAG already exists without a release; dispatch this workflow with that tag to recover"
            exit 1
          fi
          case "$TAG" in *alpha*|*beta*|*rc*) pre=true ;; *) pre=false ;; esac
          { echo "ready=true"; echo "tag=$TAG"; echo "tag_object=$tag_object"; echo "sha=$sha"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release candidate
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: macos-15
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Configure macOS SDK for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --sdk macosx --show-sdk-path) -Wno-everything" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: whisper-bundled-bindings-v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check -p Zana-app --locked

      - name: Compile tests
        run: cargo test -p Zana-app --locked --no-run

      - name: Run contract tests
        run: cargo test -p Zana-app --locked --test app_contracts

      - name: Run clippy
        run: cargo clippy -p Zana-app --all-targets --all-features --locked -- -D warnings

  preflight:
    name: Check signing secrets and notary login
    needs: validate
    if: needs.validate.outputs.ready == 'true' && !inputs.preview && (inputs.signing || 'developer-id') == 'developer-id'
    runs-on: macos-15
    steps:
      - name: Check signing secrets before the long build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ -z "$APPLE_API_KEY_ID$APPLE_API_ISSUER$APPLE_API_PRIVATE_KEY" ]; then
            for name in APPLE_ID APPLE_APP_PASSWORD; do [ -n "${!name}" ] || missing+=("$name"); done
          else
            for name in APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do [ -n "${!name}" ] || missing+=("$name"); done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::developer-id release is missing secrets: ${missing[*]}"
            exit 1
          fi

          # Prove Apple accepts the notarization login now, not 40 minutes in.
          if [ -n "$APPLE_API_KEY_ID" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
            auth=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          if ! xcrun notarytool history "${auth[@]}" >/dev/null; then
            echo "::error::Apple rejected the notarization login; replace APPLE_APP_PASSWORD or set the APPLE_API_* secrets"
            exit 1
          fi
          rm -f "${KEY_PATH:-/nonexistent}"
          echo "Notarization login accepted"


  build-macos:
    name: Build Apple silicon app
    needs: [validate, verify, preflight]
    if: ${{ needs.validate.outputs.ready == 'true' && !failure() && !cancelled() }}
    runs-on: macos-15
    env:
      SIGNING: ${{ (inputs.preview && 'unsigned') || inputs.signing || 'developer-id' }}
      TAG: ${{ needs.validate.outputs.tag }}
      APP_PATH: target/aarch64-apple-darwin/release/bundle/macos/Zana.app
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure macOS SDK for bindgen
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --sdk macosx --show-sdk-path) -Wno-everything" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: whisper-bundled-bindings-v1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Apple silicon app
        run: cargo tauri build --target aarch64-apple-darwin --bundles app -- --locked

      - name: Verify Apple silicon app
        run: |
          test -d "$APP_PATH"
          file "$APP_PATH/Contents/MacOS/Zana-app" | grep -q 'Mach-O 64-bit executable arm64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "${TAG#v}"

      - name: Import Developer ID certificate
        if: env.SIGNING == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zana-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Sign Apple silicon app (Developer ID)
        if: env.SIGNING == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ENTITLEMENTS="src-tauri/entitlements.plist"

          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            find "$APP_PATH/Contents/Frameworks" -type f -name "*.dylib" -exec \
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" {} \;
          fi

          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH/Contents/MacOS/Zana-app"

          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Seal Apple silicon app (ad-hoc, unsigned mode)
        if: env.SIGNING == 'unsigned'
        run: |
          # Unsigned arm64 binaries are killed at load; an ad-hoc seal lets the
          # app start after the user clears quarantine.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app before creating DMG
        if: env.SIGNING == 'developer-id'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP_ZIP="$RUNNER_TEMP/Zana.app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"

          # App Store Connect API key is preferred: it does not die when the
          # Apple ID password or app-specific password changes.
          if [ -n "$APPLE_API_KEY_ID" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
            auth=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi

          xcrun notarytool submit "$APP_ZIP" "${auth[@]}" --wait --timeout 45m --output-format json \
            | tee "$RUNNER_TEMP/notary-app.json"
          status="$(jq -r .status "$RUNNER_TEMP/notary-app.json")"
          if [ "$status" != Accepted ]; then
            id="$(jq -r .id "$RUNNER_TEMP/notary-app.json")"
            [ -n "$id" ] && [ "$id" != null ] && xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::App notarization status: $status"
            exit 1
          fi

          # Staple the app ticket before it is copied into the DMG. This keeps
          # a copied Zana.app independently verifiable when taken from the DMG.
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          rm -f "${KEY_PATH:-/nonexistent}" "$APP_ZIP"

      - name: Create DMG with an Applications shortcut
        run: |
          DMG_PATH="Zana-$TAG-apple-silicon.dmg"
          staging="$(mktemp -d)"
          ditto "$APP_PATH" "$staging/Zana.app"
          ln -s /Applications "$staging/Applications"
          rm -f "$DMG_PATH"
          hdiutil create -volname "Zana" -srcfolder "$staging" -ov -format UDZO \
            -imagekey zlib-level=9 "$DMG_PATH"
          rm -rf "$staging"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple DMG
        if: env.SIGNING == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"

          # App Store Connect API key is preferred: it does not die when the
          # Apple ID password or app-specific password changes.
          if [ -n "$APPLE_API_KEY_ID" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
            auth=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi

          xcrun notarytool submit "$DMG_PATH" "${auth[@]}" --wait --timeout 45m --output-format json \
            | tee "$RUNNER_TEMP/notary.json"
          status="$(jq -r .status "$RUNNER_TEMP/notary.json")"
          if [ "$status" != Accepted ]; then
            id="$(jq -r .id "$RUNNER_TEMP/notary.json")"
            [ -n "$id" ] && [ "$id" != null ] && xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::Notarization status: $status"
            exit 1
          fi
          rm -f "${KEY_PATH:-/nonexistent}"

          # Stapling downloads the ticket from Apple's CDN; retry transient network drops.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$DMG_PATH" && break
            [ "$attempt" = 5 ] && exit 1
            echo "stapler attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Verify DMG layout
        run: |
          mount_dir="$(mktemp -d)"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$mount_dir"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          codesign --verify --deep --strict "$mount_dir/Zana.app"
          if [ "$SIGNING" = developer-id ]; then
            xcrun stapler validate "$mount_dir/Zana.app"
            spctl --assess --type execute --verbose=2 "$mount_dir/Zana.app"
          fi
          hdiutil detach "$mount_dir"
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"

      - name: Clean up signing keychain
        if: always() && env.SIGNING == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/zana-signing.keychain-db" || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zana-macos-apple-silicon
          path: Zana-*.dmg*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, build-macos]
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Zana-macos-apple-silicon

      - name: Create release (refuses to overwrite an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SIGNING: ${{ (inputs.preview && 'unsigned') || inputs.signing || 'developer-id' }}
        run: |
          DMG="Zana-$TAG-apple-silicon.dmg"
          test -s "$DMG"
          test -s "$DMG.sha256"
          sha256sum --check --strict "$DMG.sha256"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Create an annotated tag only after the signed package has passed verification.
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [ "$main_sha" != "$RELEASE_SHA" ]; then
              echo "Skipping stale release candidate $RELEASE_SHA; main is now $main_sha"
              exit 0
            fi
            TAG_OBJECT="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f message="Release $TAG" -f object="$RELEASE_SHA" -f type=commit --jq .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TAG_OBJECT" --silent
          fi
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')" || { echo "::error::Could not read the remote tag $TAG before publishing"; exit 1; }
          [ -n "$TAG_OBJECT" ] && [ "$remote_tag_object" = "$TAG_OBJECT" ] || { echo "::error::Remote tag $TAG changed after validation; refusing to publish"; exit 1; }
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Zana $TAG")
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          if [ "$SIGNING" = unsigned ]; then
            args+=(--notes "### Install (unsigned build)
          This build is not notarized, so macOS warns on first launch.
          1. Drag **Zana.app** to /Applications.
          2. Right-click Zana, choose **Open**, then **Open** again (once), or run:
             \`xattr -dr com.apple.quarantine /Applications/Zana.app\`")
          fi
          gh release create "$TAG" "$DMG" "$DMG.sha256" "${args[@]}"
